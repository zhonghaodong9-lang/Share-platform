<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 创作工坊</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>🎬 AI 创作工坊</h1>
      <div class="sub">AI-Powered Creative Studio</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">创作中心</div>
      <button class="nav-item active" data-tab="dashboard"><span class="icon">🏠</span>工作台</button>
      <button class="nav-item" data-tab="script"><span class="icon">🤖</span>AI 剧本</button>
      <button class="nav-item" data-tab="copywriting"><span class="icon">✍️</span>文案助手</button>
      <button class="nav-item" data-tab="materials"><span class="icon">📦</span>素材库</button>
      <button class="nav-item" data-tab="projects"><span class="icon">🎯</span>项目管理</button>
      <button class="nav-item" data-tab="settings"><span class="icon">⚙️</span>设置</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">创</div>
        <span id="sidebarUser">创作者</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-area">
    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">工作台</span>
      <div class="topbar-actions">
        <span class="topbar-status"><span class="pulse-dot"></span>AI 就绪</span>
      </div>
    </header>

    <div class="content-area">
      <!-- Tab: Dashboard -->
      <div class="tab-content active" id="tab-dashboard">
        <div class="stats-grid">
          <div class="stat-card"><div class="num" id="statScripts">0</div><div class="label">AI 剧本</div></div>
          <div class="stat-card cyan"><div class="num" id="statCopy">0</div><div class="label">文案</div></div>
          <div class="stat-card green"><div class="num" id="statMaterials">0</div><div class="label">素材</div></div>
          <div class="stat-card pink"><div class="num" id="statProjects">0</div><div class="label">项目</div></div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><span class="card-title">⚡ 快速创作</span></div>
            <div class="form-group">
              <label>输入主题或关键词</label>
              <textarea id="quickTopic" placeholder="例如：科技前沿、生活技巧、美食探店..." rows="2"></textarea>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-primary" onclick="quickGenerate('script')">🤖 生成剧本</button>
              <button class="btn btn-secondary" onclick="quickGenerate('copy')">✍️ 生成文案</button>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">📋 最近项目</span></div>
            <div id="recentProjects"><div class="empty-state"><p>暂无项目，开始创作吧！</p></div></div>
          </div>
        </div>
      </div>

      <!-- Tab: AI Script -->
      <div class="tab-content" id="tab-script">
        <div class="card">
          <div class="card-header"><span class="card-title">🤖 <span class="accent">AI 剧本生成</span></span></div>
          <div class="form-row">
            <div class="form-group">
              <label>视频主题</label>
              <input id="scriptTopic" placeholder="输入视频主题，如：AI改变生活">
            </div>
            <div class="form-group">
              <label>视频时长</label>
              <select id="scriptDuration"><option value="60">1 分钟</option><option value="180" selected>3 分钟</option><option value="300">5 分钟</option><option value="600">10 分钟</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>目标受众</label>
              <input id="scriptAudience" placeholder="如：年轻人、职场人士、学生">
            </div>
            <div class="form-group">
              <label>视频风格</label>
              <select id="scriptStyle"><option value="professional">专业讲解</option><option value="casual" selected>轻松日常</option><option value="dramatic">戏剧张力</option><option value="educational">教育科普</option></select>
            </div>
          </div>
          <button class="btn btn-primary" onclick="generateScript()">🚀 AI 生成剧本</button>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">📜 生成结果</span>
            <button class="btn btn-sm btn-ghost" onclick="saveCurrentScript()">💾 保存到项目</button>
          </div>
          <div class="ai-output" id="scriptOutput"><div class="placeholder">输入主题，点击生成，AI 将为你创作完整剧本 🎬</div></div>
        </div>
      </div>

      <!-- Tab: Copywriting -->
      <div class="tab-content" id="tab-copywriting">
        <div class="card">
          <div class="card-header"><span class="card-title">✍️ <span class="accent">AI 文案生成</span></span></div>
          <div class="form-group">
            <label>内容主题</label>
            <input id="copyTopic" placeholder="输入文案主题或视频标题">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>文案类型</label>
              <select id="copyType"><option value="title">视频标题</option><option value="description">视频描述</option><option value="script_snippet">脚本片段</option><option value="social">社交媒体文案</option><option value="hashtags">标签/话题</option></select>
            </div>
            <div class="form-group">
              <label>语气风格</label>
              <select id="copyTone"><option value="professional">专业</option><option value="casual" selected>轻松</option><option value="humorous">幽默</option><option value="inspiring">励志</option><option value="urgent">紧迫</option></select>
            </div>
          </div>
          <button class="btn btn-primary" onclick="generateCopy()">✍️ 生成文案</button>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">📝 生成结果</span></div>
          <div class="ai-output" id="copyOutput"><div class="placeholder">输入主题，AI 帮你写出吸睛文案 ✨</div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">📚 已保存文案</span>
            <button class="btn btn-sm btn-secondary" onclick="showNewCopyModal()">+ 手动添加</button>
          </div>
          <div id="copyList"></div>
        </div>
      </div>

      <!-- Tab: Materials -->
      <div class="tab-content" id="tab-materials">
        <div class="card">
          <div class="card-header">
            <span class="card-title">📦 素材库</span>
            <button class="btn btn-sm btn-secondary" onclick="showNewMaterialModal()">+ 添加素材</button>
          </div>
          <div class="form-row" style="margin-bottom:16px">
            <div class="form-group"><input id="materialSearch" placeholder="搜索素材..." oninput="renderMaterials()"></div>
            <div class="form-group">
              <select id="materialTypeFilter" onchange="renderMaterials()">
                <option value="all">全部类型</option>
                <option value="video">视频</option>
                <option value="image">图片</option>
                <option value="audio">音频</option>
                <option value="text">文本</option>
              </select>
            </div>
          </div>
          <div class="material-grid" id="materialGrid"></div>
        </div>
      </div>

      <!-- Tab: Projects -->
      <div class="tab-content" id="tab-projects">
        <div class="pipeline">
          <div class="pipeline-stage" data-stage="idea"><div class="stage-icon">💡</div><div class="stage-name">创意</div></div>
          <div class="pipeline-stage" data-stage="script"><div class="stage-icon">📜</div><div class="stage-name">剧本</div></div>
          <div class="pipeline-stage" data-stage="material"><div class="stage-icon">📦</div><div class="stage-name">素材</div></div>
          <div class="pipeline-stage" data-stage="copy"><div class="stage-icon">✍️</div><div class="stage-name">文案</div></div>
          <div class="pipeline-stage" data-stage="production"><div class="stage-icon">🎬</div><div class="stage-name">制作</div></div>
          <div class="pipeline-stage" data-stage="done"><div class="stage-icon">✅</div><div class="stage-name">完成</div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">🎯 所有项目</span>
            <button class="btn btn-sm btn-secondary" onclick="showNewProjectModal()">+ 新建项目</button>
          </div>
          <div id="projectList"></div>
        </div>
      </div>

      <!-- Tab: Settings -->
      <div class="tab-content" id="tab-settings">
        <div class="card">
          <div class="card-header"><span class="card-title">⚙️ 平台设置</span></div>
          <div class="form-group">
            <label>创作者名称</label>
            <input id="settingsName" value="创作者" onchange="updateSettings()">
          </div>
          <div class="form-group">
            <label>AI API Key（可选，用于自动生成）</label>
            <input id="settingsApiKey" type="password" placeholder="输入 OpenAI / Claude API Key" onchange="updateSettings()">
          </div>
          <div class="form-group">
            <label>默认视频时长</label>
            <select id="settingsDuration" onchange="updateSettings()">
              <option value="60">1 分钟</option>
              <option value="180" selected>3 分钟</option>
              <option value="300">5 分钟</option>
              <option value="600">10 分钟</option>
            </select>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary" onclick="exportAllData()">📤 导出数据</button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllData(event)">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="materialModal">
  <div class="modal">
    <div class="modal-title">添加素材</div>
    <div class="form-group"><label>素材名称</label><input id="matName" placeholder="素材名称"></div>
    <div class="form-row">
      <div class="form-group"><label>类型</label><select id="matType"><option value="video">视频</option><option value="image">图片</option><option value="audio">音频</option><option value="text">文本</option></select></div>
      <div class="form-group"><label>标签（逗号分隔）</label><input id="matTags" placeholder="科技, AI, 教程"></div>
    </div>
    <div class="form-group"><label>描述/链接</label><textarea id="matDesc" rows="2"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal('materialModal')">取消</button>
      <button class="btn btn-primary" onclick="saveMaterial()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="copyModal">
  <div class="modal">
    <div class="modal-title">手动添加文案</div>
    <div class="form-group"><label>标题/类型</label><input id="copyManualTitle" placeholder="如：视频标题"></div>
    <div class="form-group"><label>内容</label><textarea id="copyManualContent" rows="4"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal('copyModal')">取消</button>
      <button class="btn btn-primary" onclick="saveManualCopy()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <div class="modal-title">新建项目</div>
    <div class="form-group"><label>项目名称</label><input id="projName" placeholder="如：AI 改变生活"></div>
    <div class="form-group"><label>项目描述</label><textarea id="projDesc" rows="2"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal('projectModal')">取消</button>
      <button class="btn btn-primary" onclick="saveProject()">创建项目</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/app.js"></script>
</body>
</html>
